[package]
name = "walkrelay-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sync engine that keeps Big Walk saves identical across a group of friends"

[lib]
name = "walkrelay_core"

[[bin]]
name = "walkrelay-cli"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "6"
hex = "0.4"
log = "0.4"
rusty-s3 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
ureq = "2.12"
url = "2"
zip = { version = "2.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
hex = "0.4"
