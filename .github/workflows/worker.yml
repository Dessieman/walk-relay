name: Deploy Worker

# Deploys the Walk Relay Worker (worker/) to your Cloudflare account, in front of
# your group's R2 bucket. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   - an API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  - your account ID (the 32 characters before .r2.cloudflarestorage.com)
on:
  workflow_dispatch:
    inputs:
      bucket:
        description: "Your R2 bucket name"
        required: true
        default: "big-walk"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Point the Worker at your bucket
        env:
          BUCKET: ${{ inputs.bucket }}
        run: |
          if ! [[ "$BUCKET" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]; then
            echo "::error::'$BUCKET' isn't a valid R2 bucket name"; exit 1
          fi
          sed -i "s/^bucket_name = .*/bucket_name = \"$BUCKET\"/" wrangler.toml
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          {
            echo "## Worker deployed"
            echo
            echo "Paste this into Walk Relay → Settings & help → **Secure this group**:"
            echo
            echo "\`$url\`"
          } >> "$GITHUB_STEP_SUMMARY"
